fingertips:
  # AIRSEAI默认的四个官方GelSight R1.5手指；不是DaiMon/W2M替换指。
  # 原点：官方胶面visual mesh的XZ包围框中心线与前表面的最外侧(-Y)交点。
  # X沿面内宽度，Y沿指长，Z为胶面朝夹持间隙的外法向；单位m。
  # 来自USD资产几何推导，非真机标定；只创建参考帧，不修改碰撞体或TacSL ROI。
  right_hand_right_finger:
    parent_frame: openarm_right_right_finger
    T_parent_from_child:
      - [-1.0, 0.0, 0.0, -5.00120222568512e-07]
