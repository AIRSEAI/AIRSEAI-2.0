NUM_EPISODES: 10
FPS: 20
EPISODE_TIME_SEC: 30
RESET_TIME_SEC: 5
TASK_DESCRIPTION: "Transfer an object between the two arms."
DATASET_REPO_ID: "openarms/bimanual_tactile"
DATASET_PATH: "${OUTPUT_ROOT}/openarms"
LOG_FILE_PATH: "${OUTPUT_ROOT}/openarms/record.log"
RECORD: true
USE_TACTILE: true
USE_DEPTH: false
FRICTION_SCALE: 1.0
GRAVITY_SCALE: 0.6

CAN:
  interface: socketcan
  use_fd: true
  bitrate: 1000000
  data_bitrate: 5000000
  state_timeout_s: 0.25
  leader: {left: can2, right: can3}
  follower: {left: can0, right: can1}

CONTROL:
  hz: 20
  calibrate: true
  leader_id: openarms_leader
  follower_id: openarms_follower
  calibration_dir: "~/.cache/huggingface/lerobot/calibration"
  max_relative_target_deg: 10
  position_kp: [240, 240, 240, 240, 24, 31, 25, 8]
  position_kd: [5, 5, 3, 5, 0.3, 0.3, 0.3, 0.3]
  max_tick_s: 0.25
  joint_limits:
    left:
      joint_1: [-75, 75]
      joint_2: [-90, 9]
      joint_3: [-85, 85]
      joint_4: [0, 135]
      joint_5: [-85, 85]
      joint_6: [-40, 40]
      joint_7: [-80, 80]
      gripper: [-65, 0]
    right:
      joint_1: [-75, 75]
      joint_2: [-9, 90]
      joint_3: [-85, 85]
      joint_4: [0, 135]
      joint_5: [-85, 85]
      joint_6: [-40, 40]
      joint_7: [-80, 80]
      gripper: [-65, 0]
  motor_config:
    joint_1: [0x01, 0x11, dm8009]
    joint_2: [0x02, 0x12, dm8009]
    joint_3: [0x03, 0x13, dm4340]
    joint_4: [0x04, 0x14, dm4340]
    joint_5: [0x05, 0x15, dm4310]
    joint_6: [0x06, 0x16, dm4310]
    joint_7: [0x07, 0x17, dm4310]
    gripper: [0x08, 0x18, dm4310]

COMPENSATION:
  gravity: true
  friction: true
  urdf_path: "../urdf/openarm_bimanual_dynamics.urdf"
  joint_name_template: "openarm_{side}_joint{index}"
  damping_kd: [0.5, 0.5, 0.5, 0.5, 0.1, 0.1, 0.1, 0.1]
  torque_limit_nm: [20, 20, 15, 15, 3, 3, 3, 1]
  friction_fc: [0.306, 0.306, 0.40, 0.166, 0.050, 0.083, 0.172, 0.0512]
  friction_k: [28.417, 28.417, 29.065, 130.038, 151.771, 242.287, 7.888, 4.000]
  friction_fv: [0.063, 0.063, 0.604, 0.813, 0.029, 0.072, 0.084, 0.084]
  friction_fo: [0.088, 0.088, 0.008, -0.058, 0.005, 0.009, -0.059, -0.050]
  friction_velocity_scale: 0.1

HOMING:
  initial_seconds: 5
  left_deg: [30, 0, 0, 45, 0, 0, -45, 0]
  right_deg: [-30, 0, 0, 45, 0, 0, 45, 0]

# Fill serial numbers before enabling acquisition.
CAMERAS:
  left_wrist: {serial: "", width: 640, height: 480, fps: 30}
  right_wrist: {serial: "", width: 640, height: 480, fps: 30}
  base: {serial: "", width: 640, height: 480, fps: 30}
CAMERA_MAX_AGE_S: 0.5
TACTILE_SENSORS:
  right_hand_index_finger: ""
  right_hand_middle_finger: ""
TACTILE:
  fps: 20
  sensor_fps: 35
  backend: cuda
  previews: false
  height: 288
  width: 384
  ready_timeout_s: 60
  max_age_s: 0.5

RECORDING:
  queue_size: 8
  writer_timeout_s: 120
  max_frame_gap_s: 0.15
  disk_buffer: true
  gripper_unit: deg
  gripper_scale: 1.0
  gripper_offset: 0.0
